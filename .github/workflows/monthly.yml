name: Campaign Type 1 - Brand A&B Monthly Report

on:
  schedule:
    - cron: "0 1 5 * *"
    - cron: "0 1 6 * *"
    - cron: "0 1 7 * *"
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Run report
        env:
          BRAND_A_API_KEY: ${{ secrets.BRAND_A_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          JOURNEY_ID_BRAND_A_CAMPAIGN1: ${{ secrets.JOURNEY_ID_BRAND_A_CAMPAIGN1 }}
          JOURNEY_START_DATE_BRAND_A_CAMPAIGN1: ${{ secrets.JOURNEY_START_DATE_BRAND_A_CAMPAIGN1 }}
        run: python report.py
